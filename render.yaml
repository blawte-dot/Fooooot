services:
  - type: web
    name: matchpredict-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --timeout 180 --workers 1 --threads 4
    envVars:
      - key: PITCHAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
