name: refresh-data
# يجلب إحصاءات المباريات ويختبر الأسواق على خوادم GitHub المجانية ويحفظ النتائج في data/ داخل المستودع.
on:
  schedule:
    - cron: "*/30 * * * *"        # كل 30 دقيقة (التشغيلات لا تتداخل: انظر concurrency)
  workflow_dispatch:             # أو يدويًا من تبويب Actions
concurrency:
  group: refresh-data
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build data
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
        run: python -m app.pipeline
      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: refresh [skip render]" && git push; fi
      - name: Build site (static app)
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
        run: python -m app.sitebuild
      - name: Save build report
        run: |
          # يُحفظ التقرير فقط عند وجود أخطاء، حتى لا يتضخم السجل بالتزامات كل نصف ساعة
          if python -c "import json,sys;sys.exit(0 if json.load(open('site/api/build.json'))['errors'] else 1)"; then
            cp site/api/build.json data/site-report.json
            git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
            git add data/site-report.json
            git commit -q -m "data: site report [skip render]" && (git pull -q --rebase && git push || true)
          else echo "no errors"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
