name: refresh-data
# المسار الثقيل والبطيء: يجلب إحصاءات المباريات ويختبر الأسواق ويضبط المعاملات ويحفظها في data/. يتقدم تدريجيًا بين التشغيلات
# (الدوريات الكبرى كل مرة، والمشهورة يوميًا، وبقية الدوريات كل 3 أيام) فلا يتجاوز الوقت المحدد.
on:
  schedule:
    - cron: "7 */4 * * *"          # شبكة أمان؛ موقع site.yml يطلقه أيضًا إن مرّت 4 ساعات
  workflow_dispatch:
concurrency:
  group: refresh-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build data
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          PIPELINE_BUDGET_MIN: "40"
        run: python -m app.pipeline
      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: refresh [skip render]" && (git pull -q --rebase && git push); fi
