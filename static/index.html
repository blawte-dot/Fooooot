<script>
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T={today:"المباريات",analysis:"التحليل",team:"فريق",leagues:"الدوريات",perf:"الأداء"};let cur="today",day=new Date().toLocaleDateString("sv"),M=[],mid=null;
const SMAP=[[/^\/api\/(predict|board|last7|market|ai|ai-news|ai-dossier|last50|team50|standings|data-status|backtest)\/([\w-]+)$/,m=>`api/${m[1]}/${m[2]}.json`],[/^\/api\/league\/([\w-]+)\/upcoming$/,m=>`api/league/${m[1]}/upcoming.json`]];
function sp(p){const u=new URL(p,location.href),q=u.searchParams,s=u.pathname;if(s=="/api/leagues")return"api/leagues.json";if(s=="/api/matches")return`api/matches/${q.get("date")}.json`;if(s=="/api/famous")return`api/famous/${q.get("date")}.json`;for(const[r,f]of SMAP){const m=s.match(r);if(m)return f(m)}return null}
const sj=async f=>{let r;try{r=await fetch(f)}catch{throw new Error("لا يوجد اتصال ولا نسخة محفوظة لهذه الصفحة")}if(!r.ok)throw new Error(/team50|last50/.test(f)?"هذه الصفحة لم تُحسب بعد. تُحسب تدريجيًا كل 30 دقيقة للمباريات والفرق الأقرب موعدًا أولًا، فجرّب لاحقًا":/api\/ai/.test(f)?"رأي Gemini لهذه المباراة لم يُحسب بعد. يُحسب للمباريات الأقرب موعدًا أولًا ويُحدَّث كل عدة ساعات، فجرّب لاحقًا":"لم تُحسب هذه الصفحة مسبقًا. التطبيق يعرض المباريات القادمة القريبة في الدوريات الخمسة الكبرى ودوري الأبطال فقط");return r.json()};
async function sapi(p){const u=new URL(p,location.href),s=u.pathname;
if(s=="/api/logos"){if(!window.LOGOS)window.LOGOS=await sj("api/logos.json").catch(()=>({}));const o={};(u.searchParams.get("ids")||"").split(",").forEach(i=>{if(window.LOGOS[i])o[i]=window.LOGOS[i]});return o}
if(s=="/api/teams"){if(!window.TEAMS)window.TEAMS=(await sj("api/teams.json")).teams;const q=(u.searchParams.get("q")||"").trim().toLowerCase().slice(0,40),b5=u.searchParams.get("big5")=="1";let t=(q||b5)?window.TEAMS.filter(x=>b5?x.big5:x.name.toLowerCase().includes(q)):[];t=b5?t.sort((a,b)=>(a.big5||"").localeCompare(b.big5||"")||a.name.localeCompare(b.name)).slice(0,130):t.sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name)).slice(0,15);return{ready:true,teams:t}}
const f=sp(p);if(!f)throw new Error("هذه الميزة غير متاحة في التطبيق المستقل حاليًا");const j=await sj(f);if(/^api\/(matches|famous|league)\//.test(f)){if(!window.BUILT){try{window.BUILT=new Set((await(await fetch("api/index.json")).json()).ids)}catch{window.BUILT=new Set()}}j.matches=(j.matches||[]).filter(m=>window.BUILT.has(m.id))}return j}
async function api(p){if(window.STATIC)return sapi(p);const r=await fetch(p);let j;try{j=await r.json()}catch{throw new Error("استجابة غير صالحة من الخادم (قد يكون يستيقظ، أعد المحاولة)")}if(!r.ok){const e=new Error(j.error?.message||"خطأ");e.code=j.error?.code;throw e}return j}
const RN={H:"فوز المضيف",D:"تعادل",A:"فوز الضيف"},okm=o=>o===true?"✅":o===false?"❌":"➖";

if(r.state=="live"){try{const L=await(await fetch("https://raw.githubusercontent.com/blawte-dot/Fooooot/live/live.json?t="+Math.floor(Date.now()/60000))).json();if(L.matches&&L.matches[mid])r={...r,...L.matches[mid],fresh:L.ts}}catch{}}
let h="";
if(r.state=="live"){const ip=r.inplay,pre=r.pre;h=`<div class="card"><b>🔴 مباشر الآن: ${r.score?r.score[0]+" - "+r.score[1]:"النتيجة الحية غير متاحة من المصدر"}${r.minute!=null?` · الدقيقة ${r.minute}`:""}</b><div class="mu">${r.minute==null?"الدقيقة غير متاحة من المصدر، فلا تُحدَّث الاحتمالات.":"مصدر الدقيقة: "+esc(r.minute_src||"")}${r.reds&&(r.reds[0]||r.reds[1])?` · طرد: ${r.reds[0]}-${r.reds[1]}`:""}${r.score_src&&r.score_src!="المصدر"?" · مصدر النتيجة: "+esc(r.score_src):""}</div>`
+(ip?`<div class="m2"><span>فوز المضيف</span><b>${ip.p[0]}%</b></div><div class="m2"><span>تعادل</span><b>${ip.p[1]}%</b></div><div class="m2"><span>فوز الضيف</span><b>${ip.p[2]}%</b></div>`+(pre?`<div class="mu">قبل المباراة: ${pre[0]} / ${pre[1]} / ${pre[2]}</div>`:"")+ip.lines.map(l=>`<div class="m2"><span>المجموع النهائي أكثر من ${l.line}</span><b>${l.over}%</b></div>`).join("")+`<div class="m2"><span>كلا الفريقين يسجل</span><b>${ip.btts}%</b></div><div class="m2"><span>الهدف القادم</span><b>مضيف ${ip.next_goal.home}% · ضيف ${ip.next_goal.away}% · لا هدف ${ip.next_goal.none}%</b></div>`:(!r.score?`<div class="mu">بلا نتيجة جارية موثوقة لا تُحسب احتمالات حية، وتبقى توقعات ما قبل المباراة أدناه.</div>`:(pre?"":`<div class="mu">لا توجد لقطة توقع قبل المباراة، فلا احتمالات حية.</div>`)))
+`<div class="mu">نموذج حي مبسّط: يفترض توزيعًا منتظمًا للأهداف زمنيًا ومعدلات ما قبل المباراة، ولا يرى الإصابات ولا التبديلات. يتحدث كل بضع دقائق وليس لحظيًا.${r.fresh?" آخر تحديث: "+esc(r.fresh.slice(11,16))+" UTC":""}</div></div>`}
else if(r.state=="post"){h=`<div class="card"><b>🏁 انتهت: ${r.score[0]} - ${r.score[1]}</b>`;
if(r.no_snapshot)h+=`<div class="mu">لا توجد نسخة محفوظة من التوقع قبل هذه المباراة، فلا مراجعة.</div>`;
else{h+=`<div class="mu">${r.retro?"تقدير بأثر رجعي (لم تُحفظ لقطة قبل المباراة)، ولا يدخل سجل الأداء.":"المراجعة مقابل توقع حُفظ قبل الانطلاق."}</div><div class="m2"><span>النتيجة: ${RN[r.result]}</span><b>احتمالها ${r.p_actual}% ${r.top_hit?"✅ الأرجح عندنا":"❌ ليست الأرجح"}</b></div><div class="mu">Brier لهذه المباراة: ${r.brier} (الأقل أفضل؛ 0.667 يعادل التخمين المتساوي)</div>`;

if(pk.length)h+=`<b>اختياراتنا «نعم»</b>`+pk.map(x=>`<div class="m2"><span>${okm(x.ok)} ${esc(x.label)}</span><b>${x.p}%</b></div>`).join("")+`<div class="mu">صحيح ${pk.filter(x=>x.ok===true).length} من ${pk.filter(x=>x.ok!==null).length} قابلة للتقييم.</div>`;
if(r.compare&&r.compare.length)h+=`<b>المتوقع مقابل الفعلي</b>`+r.compare.map(c=>`<div class="m2"><span>${esc(c.label)}</span><b>متوقع ${c.exp.total} · فعلي ${c.act.total}</b></div>`).join("");
if(!r.stats_ok)h+=`<div class="mu">إحصاءات المباراة التفصيلية لم تتوفر بعد من المصدر، فالتقييم يقتصر على النتيجة والأهداف.</div>`}
h+="</div>"}
if(h&&mid)$("#v").insertAdjacentHTML("afterbegin",h)}
async function trk(){if(!window.STATIC)return;let t;try{t=await sj("api/trackrecord.json")}catch{return}
$("#v").insertAdjacentHTML("afterbegin",`<div class="card"><b>📊 سجل الأداء الحي (توقعات حُفظت قبل المباريات)</b>`+(t.matches?`<div class="m2"><span>مباريات مُقيَّمة</span><b>${t.matches}</b></div><div class="m2"><span>الأرجح عندنا تحقق</span><b>${t.top_hit_pct}%</b></div><div class="m2"><span>Brier / LogLoss</span><b>${t.brier} / ${t.logloss}</b></div>`+(t.picks.length?`<div class="mu">معايرة اختيارات «نعم»: ما ادّعيناه ← ما تحقق فعلًا</div>`+t.picks.map(p=>`<div class="m2"><span>${p.bucket} (${p.n})</span><b>${p.claimed}% ← ${p.actual}%</b></div>`).join(""):""):`<div class="mu">لا توجد مباريات مُقيَّمة بعد. يبدأ السجل من أول مباراة حُفظت لقطتها قبل انطلاقها ثم انتهت.</div>`)+`<div class="mu">${esc(t.note)}</div></div>`)}
const V={today,analysis:async()=>{await analysis();ph()},team,l50,l7:()=>l50(7),board,leagues,perf:async()=>{await perf();trk()}};
function go(){$("#nav").innerHTML=Object.entries(T).map(([k,t])=>`<button class="${k==cur?"on":""}" data-k="${k}">${t}</button>`).join("");
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{cur=b.dataset.k;go()});V[cur]();window.scrollTo(0,0)}
const ld=m=>`<div class="mu">${m}</div>`,er=e=>`<div class="card er">${esc(e.message)}</div>`;
const LC={};
const cr=(id,name)=>`<span class="crest" data-t="${esc(id)}">${esc((name||"?").trim().charAt(0))}</span>`;
const crU=(u,name)=>`<span class="crest">${u?`<img src="${esc(u)}" alt="${esc((name||"?").trim().charAt(0))}" onerror="this.parentNode.textContent=this.alt">`:esc((name||"?").trim().charAt(0))}</span>`;
async function fillLogos(root){if(!root)return;const els=[...root.querySelectorAll(".crest[data-t]")];const need=[...new Set(els.map(e=>e.dataset.t).filter(i=>!(i in LC)))];

els.forEach(e=>{const u=LC[e.dataset.t];if(u)e.innerHTML=`<img src="${esc(u)}" alt="${esc(e.textContent)}" onerror="this.parentNode.textContent=this.alt">`})}
const dstr=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("sv")};
let B5=null,big=false,fam=false;
async function today(){
const chips=[...Array(7).keys()].map(n=>`<button class="ch ${day==dstr(n)?"on":""}" data-d="${dstr(n)}">${n==0?"اليوم":n==1?"غدًا":new Date(dstr(n)+"T12:00").toLocaleDateString("ar",{weekday:"short",day:"numeric"})}</button>`).join("")+`<button class="ch ${day=="all"?"on":""}" data-d="all">كل الأسبوع</button>`;
$("#v").innerHTML=`<h2>المباريات (السابقة والقادمة)</h2><div class="chs">${chips}</div><div class="chs"><button class="ch ${fam?"on":""}" id="fm">⭐ أشهر المباريات</button><button class="ch ${big?"on":""}" id="b5">الخمس الكبرى فقط</button></div><input type="date" id="d" value="${day=="all"?"":day}"><input id="q" placeholder="ابحث عن فريق"><select id="lg"><option value="">كل الدوريات</option></select><div id="l">${ld("جارٍ التحميل…")}</div>`;

<div class="row"><b>${i<40?cr(m.home_team.id,m.home_team.name):""}${esc(m.home_team.name)} ${m.score_home!=null?m.score_home+" - "+m.score_away:"×"} ${i<40?cr(m.away_team.id,m.away_team.name):""}${esc(m.away_team.name)}</b><button class="b" data-id="${esc(m.id)}">حلّل</button></div></div>`).join(""):ld(fam?"لا توجد مباريات مشهورة في هذا التاريخ (أندية مشهورة أو دوري الأبطال).":big?"لا توجد مباريات من الخمس الكبرى في هذا التاريخ.":"لا توجد مباريات مغطاة في هذا التاريخ.");

async function board(){clearTimeout(bdt);if(!mid){$("#v").innerHTML=ld("اختر مباراة من تبويب «المباريات» ثم اضغط حلّل، ثم «لوحة الأسواق».");return}

h+=`<div class="card mu">⚠️ ${esc(r.disclaimer)}</div>`;

["goals","sot","shots","yellow","corners","corners_1h","corners_2h","fouls"].forEach(k=>{const x=r.metrics[k];if(!x)return;
h+=`<details class="card" ${k=="goals"||k=="sot"?"open":""}><summary>${esc(x.label||k)}${gbadge(G[k])}</summary>`+(x.available?`<div class="mu">المتوقع: ${esc(m.home)} ${x.exp_home} · ${esc(m.away)} ${x.exp_away} · المجموع ${x.exp_total} (من ${x.n_rows} مباراة${G[k]?` · الاختبار: ${G[k].n} مباراة، تحسن LogLoss ${G[k].log_loss_gain}`:""})</div>`+x.lines.map(l=>lrow("المجموع",l)).join("")+x.team_lines.home.map(l=>lrow(m.home,l)).join("")+x.team_lines.away.map(l=>lrow(m.away,l)).join("")+(RACEK.includes(k)&&x.race?raceH(x,m):""):`<div class="mu" style="margin-top:6px">${esc(x.reason)}</div>`)+`</details>`});
h+=`<div class="card mu">الشارة: «جيد» = تفوق النموذج على المتوسط التاريخي في اختبار على مباريات لم يرها، «ضعيف» = لا يتفوق فلا يُقترح منه شيء. «المعتاد» = نسبة تحقق الخط تاريخيًا في هذا الدوري.</div></div>`;

let lb=false;

const dr=()=>{let q=$("#ls").value.trim().toLowerCase().replace(/أ|إ|آ/g,"ا");if(q.includes("ابطال"))q="champions";else if(q.includes("اوروبا"))q="europa";

$("#ll").innerHTML=F.length?F.map(l=>`<div class="card row lg" data-id="${esc(l.id)}" style="cursor:pointer"><span>${crU(l.image_url,l.name)}${esc(l.name)}${l.big5?' <span class="mu">★</span>':""}</span><span class="mu">${esc(l.country_code)} · ${esc((l.seasons||[])[0]||"")}</span></div>`).join(""):`<div class="card mu">لا يوجد دوري بهذا الاسم في كتالوج المصدر.</div>`;

$("#lb5").onclick=()=>{lb=!lb;$("#lb5").classList.toggle("on",lb);dr()};$("#ls").oninput=dr;dr()}catch(e){$("#v").innerHTML=er(e)}}
let LV={id:null,mode:"all",data:null,tmr:null};
const FC={W:"#3ddc97",D:"#c9d1dc",L:"#ff6b6b"};
const formH=a=>a.map(x=>`<span class="fw" style="color:${FC[x]}">${x=="W"?"ف":x=="D"?"ت":"خ"}</span>`).join(" ");
async function lgv(id,season){clearTimeout(LV.tmr);LV.id=id;if(!$("#stw"))$("#v").innerHTML=ld("جارٍ حساب الترتيب…");
try{const r=await api("/api/standings/"+id+(season?"?season="+encodeURIComponent(season):""));if(cur!="leagues"||LV.id!=id)return;LV.data=r;stView();
if(r.stats_loading&&LV.mode=="stats")LV.tmr=setTimeout(()=>{if(cur=="leagues"&&LV.id==id)lgv(id,r.season)},10000)}catch(e){if(cur=="leagues")$("#v").innerHTML=er(e)}}
function stView(){const D=LV.data,mode=LV.mode,L=D.league;let rows=D.table.slice();
if(mode=="home"||mode=="away")rows.sort((a,b)=>b[mode].pts-a[mode].pts||b[mode].gd-a[mode].gd||b[mode].gf-a[mode].gf||a.name.localeCompare(b.name));
const nm=(t,i)=>`<td>${i}</td><td class="n">${cr(t.id,t.name)}${esc(t.name)}</td>`;
const sc=(t,k)=>{const x=t.stats[k];return x?`${x.for} / ${x.against}`:"—"};
let head,body;
if(mode=="stats"){head=["#","الفريق","تسديدات","على المرمى","صفراء","ركنيات","أخطاء","xG","مباريات"];
body=rows.map(t=>`<tr>${nm(t,t.pos)}<td>${sc(t,"shots")}</td><td>${sc(t,"sot")}</td><td>${sc(t,"yellow")}</td><td>${sc(t,"corners")}</td><td>${sc(t,"fouls")}</td><td>${sc(t,"xg")}</td><td>${Math.max(0,...Object.values(t.stats).map(x=>x.n))||"—"}</td></tr>`).join("")}
else{const k=mode=="all"?"all":mode;head=["#","الفريق","لعب","فاز","تعادل","خسر","له","عليه","فارق","نقاط"].concat(mode=="all"?["الشكل"]:[]);
body=rows.map((t,i)=>{const b=t[k];return `<tr>${nm(t,mode=="all"?t.pos:i+1)}<td>${b.p}</td><td>${b.w}</td><td>${b.d}</td><td>${b.l}</td><td>${b.gf}</td><td>${b.ga}</td><td>${b.gd>0?"+":""}${b.gd}</td><td class="pt">${b.pts}</td>${mode=="all"?`<td>${formH(t.form)}</td>`:""}</tr>`}).join("")}
const M={all:"الكل",home:"على أرضه",away:"خارج أرضه",stats:"متوسط الإحصاءات"};const sm=D.summary;
$("#v").innerHTML=`<div id="stw"><div class="card"><div class="row"><b class="big">${crU(L.logo,L.name)}${esc(L.name)}</b><select id="sn" style="width:auto;margin:0">${D.seasons.map(x=>`<option ${x==D.season?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
<div class="mu">${D.played} مباراة منتهية${D.through?" · آخر مباراة "+esc(D.through):""}${sm.goals_per_match!=null?` · متوسط الأهداف ${sm.goals_per_match} · فوز المضيف ${sm.home_win_pct}% · تعادل ${sm.draw_pct}% · فوز الضيف ${sm.away_win_pct}%`:""}</div></div>
<div class="chs">${Object.entries(M).map(([k,t])=>`<button class="ch ${k==mode?"on":""}" data-m="${k}">${t}</button>`).join("")}<button class="ch" id="upb">المباريات القادمة</button></div>
${mode=="stats"&&D.stats_loading?`<div class="card mu">جارٍ تحميل إحصاءات المباريات (${D.stats_done}/${D.stats_total}). تتحدث الصفحة تلقائيًا.</div>`:""}
<div class="tw"><table class="st"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
${mode=="stats"?`<div class="card mu">الأرقام «له / عليه» بمتوسط المباراة الواحدة في هذا الدوري فقط. «—» = غير متوفرة في المصدر لهذه المباريات، وعمود «مباريات» عدد المباريات التي توفرت إحصاءاتها.</div>`:""}
<div class="card mu">${esc(D.note)}</div><button class="b" id="dsb">حالة البيانات</button> <button class="b" id="bkl">رجوع للدوريات</button><div id="dsr"></div></div>`;
document.querySelectorAll("#stw .ch[data-m]").forEach(b=>b.onclick=()=>{LV.mode=b.dataset.m;stView();if(LV.mode=="stats"&&D.stats_loading)lgv(LV.id,D.season)});

async function up(id){$("#v").innerHTML=ld("جارٍ جلب المباريات القادمة…");

async function perf(){$("#v").innerHTML='<h2>اختبار أداء النموذج</h2><select id="bl"><option value="">اختر دوريًا…</option></select><div id="bo">'+ld("الاختبار يستغرق من 10 إلى 60 ثانية.")+"</div>";

try{const r=await api("/api/backtest/"+e.target.value);if(!r.result){$("#bo").innerHTML=`<div class="card er">${esc(r.reason)}</div>`;return}
const R=r.result,N={baseline:"نموذج أساسي",poisson:"Poisson",poisson_decay:"Poisson + تحلل زمني",dixon_coles_decay:"Dixon-Coles + تحلل زمني"};
$("#bo").innerHTML=`<div class="card"><b>${esc(r.league)}</b><div class="mu">${R.tested_matches} مباراة · ${esc(R.period[0])} إلى ${esc(R.period[1])}</div></div>`+
Object.entries(R.models).map(([k,m])=>m?`<div class="card"><b>${N[k]||k}</b><div>Brier ${m.brier} · LogLoss ${m.log_loss} · دقة الأرجح ${m.accuracy}%</div></div>`:"").join("")+
(R.goals_markets?Object.entries({over25:"أكثر من 2.5 هدف",btts:"كلا الفريقين يسجل"}).map(([k,t])=>{const g=R.goals_markets[k];return g?`<div class="card"><b>سوق ${t}</b><div>النموذج: Brier ${g.brier} · LogLoss ${g.log_loss}<br>المتوسط التاريخي: Brier ${g.baseline_brier} · LogLoss ${g.baseline_log_loss}</div><div class="mu">${g.log_loss<g.baseline_log_loss?"يتفوق على المتوسط":"لا يتفوق على المتوسط"} (${g.n} مباراة)</div></div>`:""}).join(""):"")+`<div class="card"><b>معايرة فوز أصحاب الأرض</b>`+R.calibration_dixon_coles_decay.map(c=>`<div class="mu">${c.range}: متوقع ${c.predicted}% · فعلي ${c.actual}% (${c.n})</div>`).join("")+`</div><div class="card mu">${esc(r.market_comparison)}. ${esc(r.note)}</div>`}catch(x){$("#bo").innerHTML=er(x)}}}
go();
if(window.STATIC){fetch("api/build.json").then(r=>r.json()).then(b=>{const d=new Date(b.generated_at),m=Math.max(0,Math.round((Date.now()-d)/60000)),t=m<60?`قبل ${m} دقيقة`:`قبل ${Math.round(m/60)} ساعة`,e=document.createElement("div");e.style.cssText="position:fixed;bottom:62px;left:8px;font-size:11px;opacity:.55;pointer-events:none;color:var(--mu)";e.textContent="آخر تحديث للبيانات: "+t;document.body.appendChild(e)}).catch(()=>{})}
</script></body></html>
